name: Build

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: pip install customtkinter pandas pymupdf openpyxl pypdf pyinstaller
    - run: pyinstaller --noconsole --onefile --hidden-import=pypdf --hidden-import=openpyxl qr_matcher.py
    - uses: actions/upload-artifact@v4
      with:
        name: app
        path: dist/qr_matcher.exe
